<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Workshop DMS{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f7fa; color: #1d2939; }
    .navbar { background: #14243a; }
    .navbar-brand { font-weight: 700; letter-spacing: .01em; }
    .card { border: 1px solid #e4e9f0; border-radius: .65rem; }
    .card-header { background: #fff; border-bottom-color: #e4e9f0; }
    .table thead th { color: #475467; font-size: .82rem; font-weight: 600; white-space: nowrap; }
    .table td, .table th { vertical-align: middle; }
    .num { text-align: right; white-space: nowrap; }
    @media print { body { background: #fff !important; } .card { border: 0; } }
  </style>
</head>
<body>
<nav class="navbar navbar-expand navbar-dark mb-4 d-print-none">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="{% url 'workshop:job_list' %}">Workshop DMS</a>
    {% if user.is_authenticated %}
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="{% url 'workshop:job_list' %}">Job cards</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'workshop:job_create' %}">New job card</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'admin:workshop_part_changelist' %}">Parts</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'admin:workshop_invoice_changelist' %}">Invoices</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'admin:workshop_sappostinglog_changelist' %}">SAP posting log</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'admin:index' %}">Master data (admin)</a></li>
      </ul>
      <span class="navbar-text me-3">{{ user.username }}</span>
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}
        <button class="btn btn-sm btn-outline-light">Log out</button>
      </form>
    {% endif %}
  </div>
</nav>
<main class="container-fluid px-4 pb-5">
  {% for message in messages %}
    <div class="alert alert-{{ message.tags|default:'info' }} d-print-none">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
